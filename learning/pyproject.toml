[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kuhhandel-learning"
version = "0.1.0"
description = "PyTorch policy-gradient trainer for Kuhhandel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "torch>=2.7,<3"]

[dependency-groups]
dev = ["mypy>=1.18,<2", "ruff>=0.13,<1"]

[project.scripts]
kuhhandel-learn = "kuhhandel_learning.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kuhhandel_learning"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
strict = true

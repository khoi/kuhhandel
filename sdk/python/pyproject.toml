[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kuhhandel-sdk"
version = "0.1.0"
description = "Async Python client for the Kuhhandel server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["websockets>=15.0.1,<16"]

[tool.hatch.build.targets.wheel]
packages = ["src/kuhhandel"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]
